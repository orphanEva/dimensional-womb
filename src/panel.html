<div class="shell">
<header><div class="brand"><i aria-hidden="true">♡</i><div><h1>次元生殖腔体 · 状态档案</h1><small>DIMENSIONAL BIO-STATUS ARCHIVE</small></div></div><div class="role"><span>当前会话</span><b id="session"></b></div></header>
<div class="desk"><nav aria-label="档案导航"><button data-tab="overview" aria-current="page">状态总览</button><button data-tab="history">事件日志</button></nav>
<main><section id="overview" class="layout"><div class="center">
<article class="scan"><div class="cardhead"><div><h3>腔体成像</h3><p id="action" hidden></p></div><span id="role"></span></div>
<div class="figure">
  <div class="rays" aria-hidden="true"></div>
  <div id="hologram" role="img" aria-label="腔体漫画分镜"></div>
  <span id="soundWord" hidden></span>
  <figure id="detail" hidden aria-hidden="true"><canvas width="288" height="170"></canvas><figcaption></figcaption></figure>
</div>

  <p id="bodyLine" hidden></p>

</aside></section>
<section id="history" hidden><div class="topline"><div><small>SESSION EVENTS</small><h2>会话事件日志</h2></div></div><article id="entries"></article></section>
</main></div></div>
